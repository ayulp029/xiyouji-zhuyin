<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-BODY-->
<title>霍格華茲夜景</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* 版面：全螢幕 3D 畫布；左上角是校名牌，底部一排是視角與開關。單一深色主題（夜色）。 */
:root {
  color-scheme: dark;
  --night: #070b1c;
  --panel: rgba(12, 16, 36, 0.72);
  --line: rgba(226, 190, 120, 0.35);
  --ink: #efe6d2;
  --ink-dim: #b9ad94;
  --gold: #e2be78;
  --gold-strong: #ffd98a;
  --font-display: "Cinzel", "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden;
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); font-size: 14px;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.plaque {
  position: fixed; top: 0; left: 0;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
}
.plaque .latin {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(22px, 4.2vw, 40px); letter-spacing: 0.14em;
  color: var(--gold); line-height: 1.1;
}
.plaque .zh { font-size: clamp(13px, 1.6vw, 16px); letter-spacing: 0.3em; color: var(--ink); margin-top: 4px; }
.plaque .hint { font-size: 12px; color: var(--ink-dim); margin-top: 10px; letter-spacing: 0.05em; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(4, 6, 18, 0.85), rgba(4, 6, 18, 0));
}
.bar .group { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.bar .sep { width: 1px; background: var(--line); margin: 4px 4px; }
button {
  font-family: var(--font-body); font-size: 13px; letter-spacing: 0.08em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 2px;
  padding: 7px 12px; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
button:hover { border-color: var(--gold); color: var(--gold-strong); }
button:focus-visible { outline: 2px solid var(--gold-strong); outline-offset: 2px; }
button[aria-pressed="true"] { background: rgba(226, 190, 120, 0.2); border-color: var(--gold); color: var(--gold-strong); }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink); }
@media (max-width: 520px) { .bar .sep { display: none; } .plaque .hint { display: none; } }
</style>

<div id="stage"></div>
<div class="plaque">
  <div class="latin">HOGWARTS</div>
  <div class="zh">霍格華茲魔法與巫術學院</div>
  <div class="hint">拖曳旋轉・滾輪或雙指縮放</div>
</div>
<div class="bar">
  <div class="group" id="views">
    <button type="button" id="v-all" data-view="all" aria-pressed="true">全景</button>
    <button type="button" id="v-castle" data-view="castle" aria-pressed="false">城堡</button>
    <button type="button" id="v-lake" data-view="lake" aria-pressed="false">黑湖</button>
    <button type="button" id="v-pitch" data-view="pitch" aria-pressed="false">魁地奇球場</button>
    <button type="button" id="v-train" data-view="train" aria-pressed="false">特快車</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button type="button" id="t-day" aria-pressed="false">白天</button>
    <button type="button" id="t-spin" aria-pressed="true">自動旋轉</button>
  </div>
</div>
<div id="err" hidden>無法載入 3D 引擎，請確認網路連線後重新整理。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
if (!window.THREE) { document.getElementById('err').hidden = false; return; }
const T = THREE;

/* ---------- 工具 ---------- */
let seed = 20261112;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function hash(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash(i, j), hash(i + 1, j), u), lerp(hash(i, j + 1), hash(i + 1, j + 1), u), v);
}
function fbm(x, y) {
  let a = 0.5, s = 0, n = 0;
  for (let o = 0; o < 4; o++) { s += a * vnoise(x, y); n += a; x *= 2.03; y *= 2.03; a *= 0.5; }
  return s / n;
}

/* ---------- 地形高度 ---------- */
const G = 30;                       // 城堡高地的高度
const LAKE = { x: -150, z: 70 };
const PITCH = { x: 150, z: -40, y: 12 };
const GATE = { x: 10, z: 150 };
const HUT = { x: 78, z: 84 };
const RAIL_Z = 200, RAIL_Y = 46;
function H(x, z) {
  const n = fbm(x * 0.012, z * 0.012);
  let h = 6 + n * 14;
  const r = Math.hypot(x, z);
  h += smooth(160, 330, r) * (30 + 95 * fbm(x * 0.006 + 5, z * 0.006 + 9));
  h = lerp(h, -8, 1 - smooth(70, 125, Math.hypot(x - LAKE.x, z - LAKE.z)));
  h = lerp(h, G, 1 - smooth(46, 80, Math.hypot(x * 0.8, z)));
  h = lerp(h, PITCH.y, 1 - smooth(50, 78, Math.hypot(x - PITCH.x, z - PITCH.z)));
  h = lerp(h, G, 1 - smooth(16, 42, Math.hypot(x - GATE.x, z - GATE.z)));
  h = lerp(h, Math.min(h, RAIL_Y - 8), 1 - smooth(4, 14, Math.abs(z - RAIL_Z)) * 1 - 0) ;
  return h;
}

/* ---------- 場景基礎 ---------- */
const stage = document.getElementById('stage');
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.FogExp2(0x0d1430, 0.0021);
const camera = new T.PerspectiveCamera(50, 1, 1, 3000);

const hemi = new T.HemisphereLight(0x33447a, 0x0a0a12, 0.45);
scene.add(hemi);
const lightDir = new T.Vector3(-0.72, 0.42, -0.55).normalize();
const sun = new T.DirectionalLight(0x9fb4ff, 0.9);
sun.position.copy(lightDir).multiplyScalar(300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 50, far: 650 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.6;
scene.add(sun);

/* 天空 */
const skyMat = new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new T.Color() }, bottom: { value: new T.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = max(normalize(vP).y, 0.0); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.55)), 1.0); }'
});
scene.add(new T.Mesh(new T.SphereGeometry(1800, 32, 16), skyMat));

const starGeo = new T.BufferGeometry();
{
  const p = [];
  for (let i = 0; i < 1800; i++) {
    const a = rnd() * Math.PI * 2, y = rnd() * 0.95 + 0.03, r = Math.sqrt(1 - y * y);
    p.push(Math.cos(a) * r * 1700, y * 1700, Math.sin(a) * r * 1700);
  }
  starGeo.setAttribute('position', new T.Float32BufferAttribute(p, 3));
}
const starMat = new T.PointsMaterial({ color: 0xffffff, size: 1.7, sizeAttenuation: false, transparent: true, fog: false, depthWrite: false });
scene.add(new T.Points(starGeo, starMat));

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new T.CanvasTexture(c);
}
const glowTex = glowTexture();
const glows = [];
function glow(parent, x, y, z, size, color, op) {
  const m = new T.SpriteMaterial({ map: glowTex, color: color, transparent: true, opacity: op, blending: T.AdditiveBlending, depthWrite: false, fog: false });
  const s = new T.Sprite(m); s.position.set(x, y, z); s.scale.set(size, size, 1);
  s.userData.op = op; parent.add(s); glows.push(s); return s;
}

const moonMat = new T.MeshBasicMaterial({ color: 0xf4f1e0, fog: false });
const moon = new T.Mesh(new T.SphereGeometry(42, 24, 16), moonMat);
moon.position.copy(lightDir).multiplyScalar(1600);
scene.add(moon);
const moonHalo = glow(scene, moon.position.x, moon.position.y, moon.position.z, 420, 0xbfd0ff, 0.55);

/* ---------- 地形 ---------- */
{
  const geo = new T.PlaneGeometry(900, 900, 220, 220); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = [];
  const c = new T.Color(), c2 = new T.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = H(x, z);
    pos.setY(i, h);
    const g = Math.hypot(H(x + 2, z) - H(x - 2, z), H(x, z + 2) - H(x, z - 2)) / 4;
    const n = vnoise(x * 0.08, z * 0.08);
    if (h < 1.5) c.set(0x3a3932);
    else if (g > 0.85) c.set(0x57534c).lerp(c2.set(0x3f3c38), n);
    else if (h > 78) c.set(0x6a6f66).lerp(c2.set(0xdfe6ee), smooth(78, 100, h));
    else c.set(0x2c4728).lerp(c2.set(0x44602f), n);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  const terrain = new T.Mesh(geo, new T.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  terrain.receiveShadow = true;
  scene.add(terrain);
}

/* 黑湖水面 */
const waterGeo = new T.PlaneGeometry(520, 520, 70, 70); waterGeo.rotateX(-Math.PI / 2);
const waterMat = new T.MeshStandardMaterial({ color: 0x0c1c33, roughness: 0.18, metalness: 0.75, flatShading: true, transparent: true, opacity: 0.93 });
const water = new T.Mesh(waterGeo, waterMat);
water.position.set(LAKE.x, 0, LAKE.z);
scene.add(water);
const waterBase = waterGeo.attributes.position.array.slice();

/* ---------- 材質 ---------- */
const windowMats = [];
function wallMaterial(cols, rows, ww, wh, lit) {
  const S = 512, tw = S / cols, th = S / rows;
  const c = document.createElement('canvas'), e = document.createElement('canvas');
  c.width = c.height = e.width = e.height = S;
  const g = c.getContext('2d'), ge = e.getContext('2d');
  g.fillStyle = '#5d584f'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += 16) for (let x = -32; x < S; x += 32) {
    const v = 112 + Math.floor(rnd() * 34);
    g.fillStyle = 'rgb(' + v + ',' + (v - 5) + ',' + (v - 16) + ')';
    g.fillRect(x + ((y / 16) % 2 ? 16 : 0) + 1, y + 1, 30, 14);
  }
  ge.fillStyle = '#000'; ge.fillRect(0, 0, S, S);
  function arch(ctx, cx, cy) {
    ctx.beginPath();
    ctx.moveTo(cx - ww / 2, cy + wh / 2); ctx.lineTo(cx - ww / 2, cy - wh / 2 + ww / 2);
    ctx.arc(cx, cy - wh / 2 + ww / 2, ww / 2, Math.PI, 0);
    ctx.lineTo(cx + ww / 2, cy + wh / 2); ctx.closePath();
  }
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    const cx = (q + 0.5) * tw, cy = (r + 0.5) * th, on = rnd() < lit;
    g.fillStyle = '#3d3a35'; arch(g, cx, cy); g.lineWidth = 5; g.strokeStyle = '#3d3a35'; g.stroke();
    g.fillStyle = on ? '#ffd27a' : '#161a26'; arch(g, cx, cy); g.fill();
    if (on) {
      const k = 0.65 + rnd() * 0.35;
      ge.fillStyle = 'rgb(' + Math.floor(255 * k) + ',' + Math.floor(175 * k) + ',' + Math.floor(70 * k) + ')';
      arch(ge, cx, cy); ge.fill();
    }
    g.fillStyle = '#3d3a35'; g.fillRect(cx - 1, cy - wh / 2, 2, wh);
    ge.fillStyle = '#000'; ge.fillRect(cx - 1, cy - wh / 2, 2, wh);
  }
  const map = new T.CanvasTexture(c), em = new T.CanvasTexture(e);
  [map, em].forEach(t => { t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = 4; });
  const mat = new T.MeshStandardMaterial({ map: map, emissiveMap: em, emissive: 0xffffff, emissiveIntensity: 1.6, roughness: 0.95 });
  windowMats.push(mat);
  return mat;
}
const WM = { mat: wallMaterial(8, 4, 15, 58, 0.55), cols: 8, rows: 4, tw: 4, th: 7 };
const HM = { mat: wallMaterial(8, 1, 24, 330, 1), cols: 8, rows: 1, tw: 5, th: 18 };
const stone = new T.MeshStandardMaterial({ color: 0x77726a, roughness: 1, flatShading: true });
const darkStone = new T.MeshStandardMaterial({ color: 0x55514c, roughness: 1, flatShading: true });
const slate = new T.MeshStandardMaterial({ color: 0x34415a, roughness: 0.75, flatShading: true });
const wood = new T.MeshStandardMaterial({ color: 0x4a3524, roughness: 1 });
const gold = new T.MeshStandardMaterial({ color: 0xd9b35a, roughness: 0.4, metalness: 0.8 });
const lampMat = new T.MeshBasicMaterial({ color: 0xffc66b });

function shadow(m) { m.castShadow = true; m.receiveShadow = true; return m; }

/* ---------- 城堡零件 ---------- */
const castle = new T.Group(); castle.position.y = G; scene.add(castle);

function box(w, h, d, x, y, z, W, parent) {     // y 為底部高度
  const geo = new T.BoxGeometry(w, h, d);
  if (W && W.mat) {
    const uv = geo.attributes.uv;
    for (let i = 0; i < 24; i++) {
      const f = i >> 2;
      if (f === 2 || f === 3) { uv.setXY(i, 0, 0); continue; }
      const span = f < 2 ? d : w;
      uv.setXY(i, uv.getX(i) * Math.max(1, Math.round(span / W.tw)) / W.cols, uv.getY(i) * Math.max(1, Math.round(h / W.th)) / W.rows);
    }
  }
  const m = shadow(new T.Mesh(geo, W && W.mat ? W.mat : (W || stone)));
  m.position.set(x, y + h / 2, z); (parent || castle).add(m); return m;
}
function gable(w, h, len, x, y, z, alongX, parent) {
  const s = new T.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const geo = new T.ExtrudeGeometry(s, { depth: len, bevelEnabled: false }); geo.translate(0, 0, -len / 2);
  const m = shadow(new T.Mesh(geo, slate));
  m.position.set(x, y, z); if (alongX) m.rotation.y = Math.PI / 2;
  (parent || castle).add(m); return m;
}
function tower(x, z, r, h, roofH, parent) {
  const p = parent || castle, base = -14, hh = h - base;
  const geo = new T.CylinderGeometry(r, r * 1.06, hh, 20);
  const uv = geo.attributes.uv, su = Math.max(2, Math.round(2 * Math.PI * r / WM.tw)) / WM.cols, sv = Math.round(hh / WM.th) / WM.rows;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  const body = shadow(new T.Mesh(geo, [WM.mat, stone, stone]));
  body.position.set(x, base + hh / 2, z); p.add(body);
  const crown = shadow(new T.Mesh(new T.CylinderGeometry(r * 1.16, r * 1.02, 1.8, 20), darkStone));
  crown.position.set(x, h - 0.9, z); p.add(crown);
  const roof = shadow(new T.Mesh(new T.ConeGeometry(r * 1.22, roofH, 20), slate));
  roof.position.set(x, h + roofH / 2, z); p.add(roof);
  const fin = new T.Mesh(new T.ConeGeometry(0.18, 3.5, 6), gold);
  fin.position.set(x, h + roofH + 1.5, z); p.add(fin);
}
function wall(x1, z1, x2, z2, h) {
  const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz);
  const m = box(L, h + 10, 2.2, (x1 + x2) / 2, -10, (z1 + z2) / 2, stone);
  m.rotation.y = -Math.atan2(dz, dx);
  for (let s = -L / 2 + 1; s < L / 2; s += 2.4) {
    const b = new T.Mesh(new T.BoxGeometry(1.2, 1.2, 2.4), darkStone);
    b.position.set(s, (h + 10) / 2 + 0.6, 0); m.add(b);
  }
}
function archBridge(L, depth, spacing, width, mat) {
  const s = new T.Shape(), n = Math.round(L / spacing), a = spacing * 0.36, top = 3 + a;
  s.moveTo(0, -depth);
  for (let i = 0; i < n; i++) {
    const cx = spacing * (i + 0.5);
    s.lineTo(cx - a, -depth); s.lineTo(cx - a, -top);
    s.absarc(cx, -top, a, Math.PI, 0, true);
    s.lineTo(cx + a, -depth);
  }
  s.lineTo(L, -depth); s.lineTo(L, 0); s.lineTo(0, 0); s.closePath();
  const geo = new T.ExtrudeGeometry(s, { depth: width, bevelEnabled: false, curveSegments: 8 });
  geo.translate(0, 0, -width / 2);
  return shadow(new T.Mesh(geo, mat));
}

/* 大禮堂（面向黑湖） */
box(16, 18, 42, -30, 0, 8, HM);
gable(17.5, 9, 43.5, -30, 18, 8, false);
[[-38, -13], [-22, -13], [-38, 29], [-22, 29]].forEach(p => tower(p[0], p[1], 2.2, 23, 7));
{ const f = shadow(new T.Mesh(new T.ConeGeometry(1.4, 12, 8), slate)); f.position.set(-30, 31, 8); castle.add(f); }

/* 主堡與各塔樓 */
box(32, 32, 26, 2, 0, -8, WM);
gable(27.5, 11, 33.5, 2, 32, -8, true);
box(14, 22, 30, 30, 0, -4, WM);
gable(15.5, 8, 31.5, 30, 22, -4, false);
box(22, 14, 12, -6, 0, 12, WM);
gable(13.5, 6, 23.5, -6, 14, 12, true);
tower(8, -24, 8.5, 52, 17);          // 大樓梯塔
tower(-13, -30, 6, 58, 14);          // 葛來分多塔
tower(-19.5, -27, 2.6, 66, 8);
tower(37, -32, 5.6, 72, 14);         // 天文塔
tower(41.8, -28.5, 2.6, 82, 8);
tower(31, 15, 5, 60, 13);            // 雷文克勞塔
tower(17, -4, 4.2, 63, 11);          // 校長室塔群
tower(21.5, -1, 2.4, 71, 8);
tower(13.5, -0.5, 2, 57, 6);
tower(-14, 4, 3.4, 44, 9);
tower(18, -16, 3, 47, 8);
tower(44, 6, 3.2, 40, 9);

/* 鐘樓 */
box(9, 46, 9, 36, 0, 36, WM);
{
  const roof = shadow(new T.Mesh(new T.ConeGeometry(7.4, 14, 4), slate));
  roof.rotation.y = Math.PI / 4; roof.position.set(36, 53, 36); castle.add(roof);
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f3e3b0'; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill();
  g.strokeStyle = '#3a2c18'; g.lineWidth = 5; g.beginPath(); g.arc(64, 64, 58, 0, 7); g.stroke();
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.beginPath(); g.moveTo(64 + Math.cos(a) * 46, 64 + Math.sin(a) * 46); g.lineTo(64 + Math.cos(a) * 55, 64 + Math.sin(a) * 55); g.stroke(); }
  g.lineWidth = 6; g.beginPath(); g.moveTo(64, 64); g.lineTo(64, 22); g.moveTo(64, 64); g.lineTo(92, 78); g.stroke();
  const ct = new T.CanvasTexture(c); ct.encoding = T.sRGBEncoding;
  const cm = new T.MeshBasicMaterial({ map: ct });
  [[0, 4.6, 0], [0, -4.6, Math.PI], [4.6, 0, Math.PI / 2], [-4.6, 0, -Math.PI / 2]].forEach(o => {
    const f = new T.Mesh(new T.CircleGeometry(3.2, 32), cm);
    f.position.set(36 + o[0], 38, 36 + o[1]); f.rotation.y = o[2]; castle.add(f);
  });

}

/* 城牆與中庭 */
wall(-30, 30, -8, 40, 9); wall(-8, 40, 6, 42, 9); wall(14, 42, 32, 37, 9);

const courtLight = new T.PointLight(0xffb45e, 1.3, 90, 2);

/* 通往大門的石橋 */
{

/* ---------- 禁忌森林 ---------- */
{
  const N = 3600, cone = new T.ConeGeometry(1, 1, 6); cone.translate(0, 0.5, 0);
  const trees = new T.InstancedMesh(cone, new T.MeshStandardMaterial({ flatShading: true, roughness: 1 }), N);
  const d = new T.Object3D(), c = new T.Color();
  let n = 0;
  for (let k = 0; k < 60000 && n < N; k++) {
    const x = (rnd() - 0.5) * 800, z = (rnd() - 0.5) * 800, h = H(x, z);
    if (h < 2.5 || h > 62) continue;
    if (Math.hypot(x * 0.8, z) < 84) continue;
    if (Math.hypot(x - PITCH.x, z - PITCH.z) < 74) continue;
    if (Math.hypot(x - GATE.x, z - GATE.z) < 34) continue;
    if (Math.hypot(x - HUT.x, z - HUT.z) < 13) continue;
    if (Math.abs(x - 10) < 7 && z > 40 && z < 150) continue;
    if (Math.abs(z - RAIL_Z) < 9) continue;
    if (fbm(x * 0.01 + 40, z * 0.01 + 7) < 0.4 && rnd() < 0.85) continue;
    if (Math.abs(H(x + 2, z) - H(x - 2, z)) > 4) continue;
    const s = 0.7 + rnd() * 0.7;
    d.position.set(x, h - 0.5, z); d.scale.set(2.6 * s, 10 * s, 2.6 * s); d.rotation.y = rnd() * 6; d.updateMatrix();
    trees.setMatrixAt(n, d.matrix);
    trees.setColorAt(n, c.setHSL(0.33 + rnd() * 0.06, 0.4, 0.1 + rnd() * 0.08));
    n++;
  }
  trees.count = n; trees.castShadow = true; scene.add(trees);
}

/* ---------- 海格小屋 ---------- */
{
  const g = new T.Group(); g.position.set(HUT.x, H(HUT.x, HUT.z) - 0.4, HUT.z); scene.add(g);
  const b = shadow(new T.Mesh(new T.CylinderGeometry(4, 4.3, 4.5, 10), stone)); b.position.y = 2.2; g.add(b);
  const r = shadow(new T.Mesh(new T.ConeGeometry(5.4, 5.5, 10), new T.MeshStandardMaterial({ color: 0x4d3b2a, flatShading: true }))); r.position.y = 7.2; g.add(r);
  const ch = new T.Mesh(new T.BoxGeometry(1, 4, 1), darkStone); ch.position.set(2, 8, -1); g.add(ch);
  for (let i = 0; i < 3; i++) {
    const a = -2.2 + i * 0.7, w = new T.Mesh(new T.PlaneGeometry(1, 1.3), lampMat);
    w.position.set(Math.sin(a) * 4.25, 2.6, Math.cos(a) * 4.25); w.rotation.y = a; g.add(w);
  }
  glow(g, -3.5, 2.6, -2.5, 12, 0xffb45e, 0.6);
  const pm = new T.MeshStandardMaterial({ color: 0xd9711c, roughness: 0.7 });
  for (let i = 0; i < 9; i++) {
    const p = new T.Mesh(new T.SphereGeometry(0.6 + rnd() * 0.5, 8, 6), pm);
    p.scale.y = 0.75; p.position.set(-7 - rnd() * 6, 0.9, -3 + rnd() * 8); p.position.y = H(HUT.x + p.position.x, HUT.z + p.position.z) - g.position.y + 0.4; g.add(p);
  }
}

/* ---------- 魁地奇球場 ---------- */
const HOUSES = [0x8b1a1a, 0x1c5a34, 0x1f3f8a, 0xd9a21c];
{
  const g = new T.Group(); g.position.set(PITCH.x, PITCH.y, PITCH.z); scene.add(g);
  const f = new T.Mesh(new T.CircleGeometry(1, 48), new T.MeshStandardMaterial({ color: 0x3f7d3a, roughness: 1 }));
  f.rotation.x = -Math.PI / 2; f.scale.set(40, 23, 1); f.position.y = 0.2; f.receiveShadow = true; g.add(f);
  const ring = new T.Mesh(new T.RingGeometry(0.985, 1, 64), new T.MeshBasicMaterial({ color: 0xdfe6d8 }));
  ring.rotation.x = -Math.PI / 2; ring.scale.set(38, 21, 1); ring.position.y = 0.3; g.add(ring);
  [-1, 1].forEach(side => [[-5, 10], [0, 13.5], [5, 10]].forEach(o => {
    const p = new T.Mesh(new T.CylinderGeometry(0.28, 0.34, o[1], 6), gold); p.position.set(side * 32, o[1] / 2, o[0]); g.add(p);
    const h = new T.Mesh(new T.TorusGeometry(1.7, 0.28, 6, 20), gold); h.rotation.y = Math.PI / 2; h.position.set(side * 32, o[1] + 1.6, o[0]); g.add(h);
  }));
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2 + 0.22, x = Math.cos(a) * 49, z = Math.sin(a) * 31, hh = 10 + (i % 3) * 2.5;
    const col = HOUSES[i % 4], m = new T.MeshStandardMaterial({ color: col, roughness: 0.9 });
    const b = shadow(new T.Mesh(new T.BoxGeometry(7, hh + 8, 6), m)); b.position.set(x, hh / 2 - 4, z); b.rotation.y = -a; g.add(b);
    const s = new T.Mesh(new T.BoxGeometry(7.1, 1.4, 6.1), gold); s.position.set(x, hh - 4, z); s.rotation.y = -a; g.add(s);
    const r = shadow(new T.Mesh(new T.ConeGeometry(5.2, 5, 4), m)); r.position.set(x, hh + 2.5, z); r.rotation.y = -a + Math.PI / 4; g.add(r);
  }
}
/* 飛天掃帚上的球員 */
const riders = [];
for (let i = 0; i < 8; i++) {
  const g = new T.Group(), col = HOUSES[i % 2 ? 0 : 1];
  const stick = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 2.6, 5), wood); stick.rotation.x = Math.PI / 2; g.add(stick);
  const tail = new T.Mesh(new T.ConeGeometry(0.3, 1, 6), new T.MeshStandardMaterial({ color: 0x9c7a3c })); tail.rotation.x = Math.PI / 2; tail.position.z = -1.6; g.add(tail);
  const body = new T.Mesh(new T.ConeGeometry(0.45, 1.5, 6), new T.MeshStandardMaterial({ color: col })); body.position.set(0, 0.7, -0.1); body.rotation.x = 0.35; g.add(body);
  const head = new T.Mesh(new T.SphereGeometry(0.26, 8, 6), new T.MeshStandardMaterial({ color: 0xe8c39e })); head.position.set(0, 1.5, 0.25); g.add(head);
  g.scale.setScalar(1.5);
  g.userData = { a: 0.35 + rnd() * 0.35, b: 0.3 + rnd() * 0.4, p: rnd() * 6, q: rnd() * 6, h: 14 + rnd() * 10 };
  scene.add(g); riders.push(g);
}
const snitch = new T.Mesh(new T.SphereGeometry(0.25, 8, 6), new T.MeshBasicMaterial({ color: 0xffe07a }));
scene.add(snitch); const snitchGlow = glow(snitch, 0, 0, 0, 4, 0xffd24a, 0.9);

/* ---------- 黑湖：船屋與小船 ---------- */
let shore = { x: -80, z: 37 };
{
  const L = Math.hypot(LAKE.x, LAKE.z), dx = LAKE.x / L, dz = LAKE.z / L;
  for (let t = 40; t < 160; t++) if (H(dx * t, dz * t) < 1) { shore = { x: dx * t, z: dz * t }; break; }
  const g = new T.Group(); g.position.set(shore.x, 0, shore.z); g.rotation.y = Math.atan2(dx, dz); scene.add(g);
  box(9, 6, 12, 0, -1, 0, stone, g); gable(10, 4, 13, 0, 5, 0, false, g);
  const w = new T.Mesh(new T.PlaneGeometry(3, 1.8), lampMat); w.position.set(0, 2, 6.05); g.add(w);
  glow(g, 0, 2, 7, 16, 0xffb45e, 0.6);
}
const boats = [];
for (let i = 0; i < 6; i++) {
  const g = new T.Group();
  const hull = new T.Mesh(new T.SphereGeometry(1, 8, 6), wood); hull.scale.set(1, 0.4, 2.4); g.add(hull);
  const l = new T.Mesh(new T.SphereGeometry(0.25, 6, 5), lampMat); l.position.set(0, 1.5, 2); g.add(l);
  const post = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 1.5, 4), wood); post.position.set(0, 0.8, 2); g.add(post);
  glow(g, 0, 1.5, 2, 9, 0xffb45e, 0.85);
  g.userData = { off: i * 0.07, side: (i % 2 ? 1 : -1) * (3 + rnd() * 5) };
  scene.add(g); boats.push(g);
}

/* ---------- 高架橋與霍格華茲特快車 ---------- */
const train = new T.Group(); scene.add(train);
const puffs = [];
{
  const via = archBridge(680, 70, 28, 6, darkStone);
  via.position.set(-340, RAIL_Y, RAIL_Z); via.castShadow = false; scene.add(via);
  [-0.9, 0.9].forEach(o => { const r = new T.Mesh(new T.BoxGeometry(680, 0.25, 0.2), new T.MeshStandardMaterial({ color: 0x2a2a30, metalness: 0.6, roughness: 0.4 })); r.position.set(0, RAIL_Y + 0.12, RAIL_Z + o); scene.add(r); });
  const red = new T.MeshStandardMaterial({ color: 0x8e1b1b, roughness: 0.5 }), black = new T.MeshStandardMaterial({ color: 0x18181b, roughness: 0.6 });
  const eng = new T.Mesh(new T.BoxGeometry(4, 3.4, 2.8), red); eng.position.set(-3, 2.2, 0); train.add(eng);
  const boiler = new T.Mesh(new T.CylinderGeometry(1.3, 1.3, 6, 12), red); boiler.rotation.z = Math.PI / 2; boiler.position.set(2, 2, 0); train.add(boiler);
  const chim = new T.Mesh(new T.CylinderGeometry(0.4, 0.5, 1.6, 8), black); chim.position.set(4, 3.8, 0); train.add(chim);
  const under = new T.Mesh(new T.BoxGeometry(11, 0.8, 2.6), black); under.position.set(0, 0.5, 0); train.add(under);
  glow(train, 5.3, 2, 0, 10, 0xfff0c0, 0.9);
  for (let i = 0; i < 5; i++) {
    const x = -11 - i * 10.5;
    const c = new T.Mesh(new T.BoxGeometry(10, 3.2, 2.8), red); c.position.set(x, 2.1, 0); train.add(c);
    const w = new T.Mesh(new T.BoxGeometry(8.6, 0.9, 2.86), lampMat); w.position.set(x, 2.6, 0); train.add(w);
    const r = new T.Mesh(new T.BoxGeometry(10, 0.3, 2.4), black); r.position.set(x, 3.85, 0); train.add(r);
    glow(train, x, 2.6, 1.6, 9, 0xffb45e, 0.35);
  }
  const pm = new T.MeshBasicMaterial({ color: 0xcfd6e6, transparent: true, opacity: 0.4, depthWrite: false });
  for (let i = 0; i < 16; i++) { const p = new T.Mesh(new T.SphereGeometry(1, 7, 5), pm); p.visible = false; p.userData.age = 99; scene.add(p); puffs.push(p); }
}

/* ---------- 魔法光點 ---------- */
const sparkGeo = new T.BufferGeometry(), SP = 280, sparkPos = new Float32Array(SP * 3), sparkV = [];
for (let i = 0; i < SP; i++) {
  sparkPos[i * 3] = (rnd() - 0.5) * 130; sparkPos[i * 3 + 1] = G + rnd() * 85; sparkPos[i * 3 + 2] = (rnd() - 0.5) * 110;
  sparkV.push(0.6 + rnd() * 1.6, rnd() * 6);
}
sparkGeo.setAttribute('position', new T.BufferAttribute(sparkPos, 3));
const sparkMat = new T.PointsMaterial({ map: glowTex, color: 0xffd98a, size: 1.6, transparent: true, opacity: 0.85, blending: T.AdditiveBlending, depthWrite: false });
scene.add(new T.Points(sparkGeo, sparkMat));

/* ---------- 視角控制 ---------- */
const VIEWS = {
  all:    { t: [0, 44, 10], r: 285, th: -0.78, ph: 1.3 },
  castle: { t: [2, 56, 0], r: 135, th: -1.15, ph: 1.36 },
  lake:   { t: [-40, 34, 20], r: 185, th: -1.2, ph: 1.52 },
  pitch:  { t: [150, 22, -40], r: 82, th: 2.35, ph: 1.2 },
  train:  { t: [0, 50, 200], r: 85, th: Math.PI + 0.5, ph: 1.3 }
};
let viewName = 'all';
const cur = { t: new T.Vector3(0, 44, 10), r: 420, th: -1.5, ph: 1.15 };
const want = { t: new T.Vector3(), r: 0, th: 0, ph: 0 };
function setView(name) {
  viewName = name; const v = VIEWS[name]; want.t.set(v.t[0], v.t[1], v.t[2]); want.r = v.r; want.th = v.th; want.ph = v.ph;
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
}
setView('all');
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let spin = !reduce, dayWant = 0, dayK = 0;
const bSpin = document.getElementById('t-spin'), bDay = document.getElementById('t-day');
bSpin.setAttribute('aria-pressed', String(spin));
bSpin.addEventListener('click', () => { spin = !spin; bSpin.setAttribute('aria-pressed', String(spin)); });
bDay.addEventListener('click', () => { dayWant = dayWant ? 0 : 1; bDay.setAttribute('aria-pressed', String(!!dayWant)); });

const cv = renderer.domElement, ptrs = new Map();
let pinch = 0;
cv.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); try { cv.setPointerCapture(e.pointerId); } catch (_) {} pinch = 0; });
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) {
    want.th -= (e.clientX - p[0]) * 0.005;
    want.ph = clamp(want.ph - (e.clientY - p[1]) * 0.004, 0.25, 1.55);
  }
  p[0] = e.clientX; p[1] = e.clientY;
  if (ptrs.size === 2) {
    const a = Array.from(ptrs.values()), d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
    if (pinch) want.r = clamp(want.r * pinch / d, 30, 520);
    pinch = d;
  }
});
function up(e) { ptrs.delete(e.pointerId); pinch = 0; }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); want.r = clamp(want.r * Math.exp(e.deltaY * 0.001), 30, 520); }, { passive: false });

function resize() {
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 68 : 50; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ---------- 日夜 ---------- */
const C = (n, d) => [new T.Color(n), new T.Color(d)];
const PAL = { top: C(0x02041a, 0x2f6fc9), bottom: C(0x1b2658, 0xcfe4f5), fog: C(0x0d1430, 0x9dbfe0), hs: C(0x33447a, 0xcfe0ff), hg: C(0x0a0a12, 0x5a5646), sun: C(0x9fb4ff, 0xfff0d2), moon: C(0xf4f1e0, 0xfff7cf), water: C(0x0c1c33, 0x2a5a7a) };
function applyDay(k) {
  skyMat.uniforms.top.value.copy(PAL.top[0]).lerp(PAL.top[1], k);
  skyMat.uniforms.bottom.value.copy(PAL.bottom[0]).lerp(PAL.bottom[1], k);
  scene.fog.color.copy(PAL.fog[0]).lerp(PAL.fog[1], k);
  scene.fog.density = lerp(0.0021, 0.0007, k);
  hemi.color.copy(PAL.hs[0]).lerp(PAL.hs[1], k); hemi.groundColor.copy(PAL.hg[0]).lerp(PAL.hg[1], k);
  hemi.intensity = lerp(0.45, 0.6, k);
  sun.color.copy(PAL.sun[0]).lerp(PAL.sun[1], k); sun.intensity = lerp(0.9, 1.25, k);
  moonMat.color.copy(PAL.moon[0]).lerp(PAL.moon[1], k);
  waterMat.color.copy(PAL.water[0]).lerp(PAL.water[1], k);
  starMat.opacity = 1 - k;
  windowMats.forEach(m => { m.emissiveIntensity = lerp(1.6, 0.12, k); });
  glows.forEach(s => { s.material.opacity = s.userData.op * lerp(1, 0.12, k); });
  moonHalo.material.opacity = lerp(0.55, 0.8, k);
  courtLight.intensity = lerp(1.3, 0.1, k);
  sparkMat.opacity = lerp(0.85, 0.15, k);
}
applyDay(0);

/* ---------- 動畫 ---------- */
const clock = new T.Clock(), tmp = new T.Vector3();
let puffTimer = 0, puffI = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  if (spin && ptrs.size === 0) want.th += dt * 0.04;
  const k = 1 - Math.exp(-dt * 2.6);
  cur.t.lerp(want.t, k); cur.r = lerp(cur.r, want.r, k); cur.th = lerp(cur.th, want.th, k); cur.ph = lerp(cur.ph, want.ph, k);
  const sp = Math.sin(cur.ph);
  camera.position.set(cur.t.x + cur.r * sp * Math.sin(cur.th), cur.t.y + cur.r * Math.cos(cur.ph), cur.t.z + cur.r * sp * Math.cos(cur.th));
  camera.position.y = Math.max(camera.position.y, H(camera.position.x, camera.position.z) + 4, 3);
  camera.lookAt(cur.t);

  if (Math.abs(dayK - dayWant) > 0.001) { dayK = lerp(dayK, dayWant, 1 - Math.exp(-dt * 2)); applyDay(dayK); }

  const wp = waterGeo.attributes.position.array;
  for (let i = 0; i < wp.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2];
    wp[i + 1] = Math.sin(x * 0.11 + t * 1.1) * 0.22 + Math.sin(z * 0.15 - t * 0.9) * 0.2 + Math.sin((x + z) * 0.31 + t * 1.7) * 0.08;
  }
  waterGeo.attributes.position.needsUpdate = true;

  riders.forEach(g => {
    const u = g.userData, pos = (tt, out) => out.set(
      PITCH.x + Math.cos(tt * u.a + u.p) * 36, PITCH.y + u.h + Math.sin(tt * 0.7 + u.q) * 5, PITCH.z + Math.sin(tt * u.b + u.q) * 20);
    pos(t, g.position); pos(t + 0.1, tmp); g.lookAt(tmp);
  });
  snitch.position.set(PITCH.x + Math.sin(t * 1.3) * 28, PITCH.y + 16 + Math.sin(t * 2.9) * 7, PITCH.z + Math.sin(t * 1.9 + 1) * 16);

  boats.forEach(g => {
    const u = g.userData, s = (t * 0.012 + u.off) % 1;
    const sx = LAKE.x - 60, sz = LAKE.z + 45, ex = shore.x - 6, ez = shore.z + 5;
    const dx = ex - sx, dz = ez - sz, L = Math.hypot(dx, dz);
    g.position.set(lerp(sx, ex, s) - dz / L * u.side, 0.25 + Math.sin(t * 1.3 + u.off * 50) * 0.12, lerp(sz, ez, s) + dx / L * u.side);
    g.rotation.y = Math.atan2(dx, dz);
    g.visible = s < 0.97;
  });

  const tx = -320 + (t * 30) % 640;
  train.position.set(tx, RAIL_Y, RAIL_Z);
  if (viewName === 'train') want.t.x = clamp(tx - 20, -210, 210);
  puffTimer += dt;
  if (puffTimer > 0.22) {
    puffTimer = 0;
    const p = puffs[puffI++ % puffs.length]; p.userData.age = 0; p.position.set(tx + 4, RAIL_Y + 5, RAIL_Z); p.visible = true;
  }
  puffs.forEach(p => {
    const a = (p.userData.age += dt); if (a > 3.4) { p.visible = false; return; }
    p.position.y += dt * 3; p.position.x -= dt * 2;
    p.scale.setScalar((0.8 + a * 1.6) * (1 - smooth(2.4, 3.4, a)) + 0.001);
  });

  for (let i = 0; i < SP; i++) {
    let y = sparkPos[i * 3 + 1] + sparkV[i * 2] * dt;
    if (y > G + 90) y = G - 4;
    sparkPos[i * 3 + 1] = y;
    sparkPos[i * 3] += Math.sin(t * 0.8 + sparkV[i * 2 + 1]) * dt * 0.8;
  }
  sparkGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-BODY-->
<title>霍格華茲夜景</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* 版面：全螢幕 3D 畫布；左上角是校名牌，底部一排是視角與開關。單一深色主題（夜色）。 */
:root {
  color-scheme: dark;
  --night: #070b1c;
  --panel: rgba(12, 16, 36, 0.72);
  --line: rgba(226, 190, 120, 0.35);
  --ink: #efe6d2;
  --ink-dim: #b9ad94;
  --gold: #e2be78;
  --gold-strong: #ffd98a;
  --font-display: "Cinzel", "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden;
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); font-size: 14px;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.plaque {
  position: fixed; top: 0; left: 0;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
}
.plaque .latin {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(22px, 4.2vw, 40px); letter-spacing: 0.14em;
  color: var(--gold); line-height: 1.1;
}
.plaque .zh { font-size: clamp(13px, 1.6vw, 16px); letter-spacing: 0.3em; color: var(--ink); margin-top: 4px; }
.plaque .hint { font-size: 12px; color: var(--ink-dim); margin-top: 10px; letter-spacing: 0.05em; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(4, 6, 18, 0.85), rgba(4, 6, 18, 0));
  pointer-events: none;
}
.bar button { pointer-events: auto; }
.bar .group { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.bar .sep { width: 1px; background: var(--line); margin: 4px 4px; }
button {
  font-family: var(--font-body); font-size: 13px; letter-spacing: 0.08em;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 2px;
  padding: 7px 12px; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
button:hover { border-color: var(--gold); color: var(--gold-strong); }
button:focus-visible { outline: 2px solid var(--gold-strong); outline-offset: 2px; }
button[aria-pressed="true"] { background: rgba(226, 190, 120, 0.2); border-color: var(--gold); color: var(--gold-strong); }
.card {
  margin-top: 14px; max-width: min(340px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold);
  padding: 10px 14px; text-shadow: none;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.card-name { font-weight: 600; font-size: 15px; letter-spacing: 0.12em; color: var(--gold-strong); }
.card-text { font-size: 13px; line-height: 1.7; color: var(--ink); margin-top: 4px; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink); }
@media (max-width: 520px) { .bar .sep { display: none; } .plaque .hint { font-size: 11px; margin-top: 6px; } button { padding: 6px 9px; } }
</style>

<div id="stage"></div>
<div class="plaque">
  <div class="latin">HOGWARTS</div>
  <div class="zh">霍格華茲魔法與巫術學院</div>
  <div class="hint">拖曳旋轉・滾輪或雙指縮放・點一下人物、建築、湖面或夜空</div>
  <div class="card" id="card" role="status" aria-live="polite" hidden><div class="card-name" id="card-name"></div><div class="card-text" id="card-text"></div></div>
</div>
<div class="bar">
  <div class="group" id="views">
    <button type="button" id="v-all" data-view="all" aria-pressed="true">全景</button>
    <button type="button" id="v-castle" data-view="castle" aria-pressed="false">城堡</button>
    <button type="button" id="v-lake" data-view="lake" aria-pressed="false">黑湖</button>
    <button type="button" id="v-village" data-view="village" aria-pressed="false">活米村</button>
    <button type="button" id="v-pitch" data-view="pitch" aria-pressed="false">魁地奇球場</button>
    <button type="button" id="v-train" data-view="train" aria-pressed="false">特快車</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button type="button" id="t-day" aria-pressed="false">白天</button>
    <button type="button" id="t-spin" aria-pressed="true">自動旋轉</button>
  </div>
</div>
<div id="err" hidden>無法載入 3D 引擎，請確認網路連線後重新整理。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
if (!window.THREE) { document.getElementById('err').hidden = false; return; }
const T = THREE;

/* ---------- 工具 ---------- */
let seed = 20261112;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function hash(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash(i, j), hash(i + 1, j), u), lerp(hash(i, j + 1), hash(i + 1, j + 1), u), v);
}
function fbm(x, y) {
  let a = 0.5, s = 0, n = 0;
  for (let o = 0; o < 4; o++) { s += a * vnoise(x, y); n += a; x *= 2.03; y *= 2.03; a *= 0.5; }
  return s / n;
}

/* ---------- 地形高度 ---------- */
const G = 30;                       // 城堡高地的高度
const LAKE = { x: -150, z: 70 };
const PITCH = { x: 150, z: -40, y: 12 };
const GATE = { x: 10, z: 150 };
const HUT = { x: 78, z: 84 };
const VIL = { x: 170, z: 120, y: 14 };
const RAIL_Z = 200, RAIL_Y = 46;
function H(x, z) {
  const n = fbm(x * 0.012, z * 0.012);
  let h = 6 + n * 14;
  const r = Math.hypot(x, z);
  h += smooth(160, 330, r) * (30 + 95 * fbm(x * 0.006 + 5, z * 0.006 + 9));
  h = lerp(h, -8, 1 - smooth(70, 125, Math.hypot(x - LAKE.x, z - LAKE.z)));
  h = lerp(h, G, 1 - smooth(46, 80, Math.hypot(x * 0.8, z)));
  h = lerp(h, PITCH.y, 1 - smooth(50, 78, Math.hypot(x - PITCH.x, z - PITCH.z)));
  h = lerp(h, G, 1 - smooth(16, 42, Math.hypot(x - GATE.x, z - GATE.z)));
  h = lerp(h, VIL.y, 1 - smooth(48, 74, Math.hypot(x - VIL.x, z - VIL.z)));
  h = lerp(h, Math.min(h, RAIL_Y - 8), 1 - smooth(4, 14, Math.abs(z - RAIL_Z)) * 1 - 0) ;
  return h;
}

/* ---------- 場景基礎 ---------- */
const stage = document.getElementById('stage');
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.FogExp2(0x0d1430, 0.0021);
const camera = new T.PerspectiveCamera(50, 1, 1, 3000);

const hemi = new T.HemisphereLight(0x33447a, 0x0a0a12, 0.45);
scene.add(hemi);
const lightDir = new T.Vector3(-0.72, 0.42, -0.55).normalize();
const sun = new T.DirectionalLight(0x9fb4ff, 0.9);
sun.position.copy(lightDir).multiplyScalar(300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 50, far: 650 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.6;
scene.add(sun);

/* 天空 */
const skyMat = new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new T.Color() }, bottom: { value: new T.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = max(normalize(vP).y, 0.0); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.55)), 1.0); }'
});
const sky = new T.Mesh(new T.SphereGeometry(1800, 32, 16), skyMat); scene.add(sky);

const starGeo = new T.BufferGeometry();
{
  const p = [];
  for (let i = 0; i < 1800; i++) {
    const a = rnd() * Math.PI * 2, y = rnd() * 0.95 + 0.03, r = Math.sqrt(1 - y * y);
    p.push(Math.cos(a) * r * 1700, y * 1700, Math.sin(a) * r * 1700);
  }
  starGeo.setAttribute('position', new T.Float32BufferAttribute(p, 3));
}
const starMat = new T.PointsMaterial({ color: 0xffffff, size: 1.7, sizeAttenuation: false, transparent: true, fog: false, depthWrite: false });
scene.add(new T.Points(starGeo, starMat));

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new T.CanvasTexture(c);
}
const glowTex = glowTexture();
const glows = [];
function glow(parent, x, y, z, size, color, op) {
  const m = new T.SpriteMaterial({ map: glowTex, color: color, transparent: true, opacity: op, blending: T.AdditiveBlending, depthWrite: false, fog: false });
  const s = new T.Sprite(m); s.position.set(x, y, z); s.scale.set(size, size, 1);
  s.userData.op = op; parent.add(s); glows.push(s); return s;
}

const moonMat = new T.MeshBasicMaterial({ color: 0xf4f1e0, fog: false });
const moon = new T.Mesh(new T.SphereGeometry(42, 24, 16), moonMat);
moon.position.copy(lightDir).multiplyScalar(1600);
scene.add(moon);
const moonHalo = glow(scene, moon.position.x, moon.position.y, moon.position.z, 420, 0xbfd0ff, 0.55);

/* ---------- 地形 ---------- */
{
  const geo = new T.PlaneGeometry(900, 900, 220, 220); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = [];
  const c = new T.Color(), c2 = new T.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = H(x, z);
    pos.setY(i, h);
    const g = Math.hypot(H(x + 2, z) - H(x - 2, z), H(x, z + 2) - H(x, z - 2)) / 4;
    const n = vnoise(x * 0.08, z * 0.08);
    if (h < 1.5) c.set(0x3a3932);
    else if (g > 0.85) c.set(0x57534c).lerp(c2.set(0x3f3c38), n);
    else if (h > 78) c.set(0x6a6f66).lerp(c2.set(0xdfe6ee), smooth(78, 100, h));
    else c.set(0x2c4728).lerp(c2.set(0x44602f), n);
    c.lerp(c2.set(0xdde6f0), (1 - smooth(46, 80, Math.hypot(x - VIL.x, z - VIL.z))) * (0.75 + n * 0.25));
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  const terrain = new T.Mesh(geo, new T.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  terrain.receiveShadow = true;
  scene.add(terrain);
}

/* 黑湖水面 */
const waterGeo = new T.PlaneGeometry(520, 520, 70, 70); waterGeo.rotateX(-Math.PI / 2);
const waterMat = new T.MeshStandardMaterial({ color: 0x0c1c33, roughness: 0.18, metalness: 0.75, flatShading: true, transparent: true, opacity: 0.93 });
const water = new T.Mesh(waterGeo, waterMat);
water.position.set(LAKE.x, 0, LAKE.z);
scene.add(water);
const waterBase = waterGeo.attributes.position.array.slice();

/* ---------- 材質 ---------- */
const windowMats = [];
function wallMaterial(cols, rows, ww, wh, lit) {
  const S = 512, tw = S / cols, th = S / rows;
  const c = document.createElement('canvas'), e = document.createElement('canvas');
  c.width = c.height = e.width = e.height = S;
  const g = c.getContext('2d'), ge = e.getContext('2d');
  g.fillStyle = '#5d584f'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += 16) for (let x = -32; x < S; x += 32) {
    const v = 112 + Math.floor(rnd() * 34);
    g.fillStyle = 'rgb(' + v + ',' + (v - 5) + ',' + (v - 16) + ')';
    g.fillRect(x + ((y / 16) % 2 ? 16 : 0) + 1, y + 1, 30, 14);
  }
  ge.fillStyle = '#000'; ge.fillRect(0, 0, S, S);
  function arch(ctx, cx, cy) {
    ctx.beginPath();
    ctx.moveTo(cx - ww / 2, cy + wh / 2); ctx.lineTo(cx - ww / 2, cy - wh / 2 + ww / 2);
    ctx.arc(cx, cy - wh / 2 + ww / 2, ww / 2, Math.PI, 0);
    ctx.lineTo(cx + ww / 2, cy + wh / 2); ctx.closePath();
  }
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    const cx = (q + 0.5) * tw, cy = (r + 0.5) * th, on = rnd() < lit;
    g.fillStyle = '#3d3a35'; arch(g, cx, cy); g.lineWidth = 5; g.strokeStyle = '#3d3a35'; g.stroke();
    g.fillStyle = on ? '#ffd27a' : '#161a26'; arch(g, cx, cy); g.fill();
    if (on) {
      const k = 0.65 + rnd() * 0.35;
      ge.fillStyle = 'rgb(' + Math.floor(255 * k) + ',' + Math.floor(175 * k) + ',' + Math.floor(70 * k) + ')';
      arch(ge, cx, cy); ge.fill();
    }
    g.fillStyle = '#3d3a35'; g.fillRect(cx - 1, cy - wh / 2, 2, wh);
    ge.fillStyle = '#000'; ge.fillRect(cx - 1, cy - wh / 2, 2, wh);
  }
  const map = new T.CanvasTexture(c), em = new T.CanvasTexture(e);
  [map, em].forEach(t => { t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = 4; });
  const mat = new T.MeshStandardMaterial({ map: map, emissiveMap: em, emissive: 0xffffff, emissiveIntensity: 1.6, roughness: 0.95 });
  windowMats.push(mat);
  return mat;
}
const WM = { mat: wallMaterial(8, 4, 15, 58, 0.55), cols: 8, rows: 4, tw: 4, th: 7 };
const HM = { mat: wallMaterial(8, 1, 24, 330, 1), cols: 8, rows: 1, tw: 5, th: 18 };
const stone = new T.MeshStandardMaterial({ color: 0x77726a, roughness: 1, flatShading: true });
const darkStone = new T.MeshStandardMaterial({ color: 0x55514c, roughness: 1, flatShading: true });
const slate = new T.MeshStandardMaterial({ color: 0x34415a, roughness: 0.75, flatShading: true });
const wood = new T.MeshStandardMaterial({ color: 0x4a3524, roughness: 1 });
const gold = new T.MeshStandardMaterial({ color: 0xd9b35a, roughness: 0.4, metalness: 0.8 });
const lampMat = new T.MeshBasicMaterial({ color: 0xffc66b });

function hitSphere(parent, r, y) {
  const m = new T.Mesh(new T.SphereGeometry(r, 8, 6), new T.MeshBasicMaterial({ visible: false }));
  m.position.y = y; parent.add(m); return m;
}
function shadow(m) { m.castShadow = true; m.receiveShadow = true; return m; }

/* ---------- 城堡零件 ---------- */
const castle = new T.Group(); castle.position.y = G; scene.add(castle);
const LANDMARKS = [
  [-30, 8, 0, '大禮堂', '全校師生用餐與舉行宴會的地方，施了魔法的天花板會映出外面的天空。'],
  [37, -32, 9, '天文塔', '城堡最高的塔。學生在午夜到這裡上天文學，觀測星星與行星。'],
  [36, 36, 8, '鐘樓', '鐘樓俯瞰著中庭，巨大的鐘擺替整座城堡報時。'],
  [-13, -30, 9, '葛來分多塔', '葛來分多學院的交誼廳與寢室就在這座塔裡，入口藏在一幅畫像後面。'],
  [31, 15, 7, '雷文克勞塔', '雷文克勞學院的塔樓，想進門得先答對門環提出的謎題。'],
  [17, -4, 6, '校長室', '校長辦公室藏在石像鬼守著的旋轉樓梯上方。'],
  [8, -24, 10, '大樓梯塔', '塔裡有一百四十二道樓梯，有些還會在你走到一半時改變方向。']
];
castle.userData.pick = function (pt) {
  if (Math.abs(pt.x + 30) < 10.5 && pt.z > -16 && pt.z < 32) return { name: LANDMARKS[0][3], text: LANDMARKS[0][4] };
  let best = null, bd = 0;
  LANDMARKS.forEach(l => { const d = Math.hypot(pt.x - l[0], pt.z - l[1]) - l[2]; if (d < bd) { bd = d; best = l; } });
  return best ? { name: best[3], text: best[4] } : { name: '霍格華茲城堡', text: '一千多年前由四位巫師創辦的魔法學校，座落在蘇格蘭高地的湖畔。' };
};

function box(w, h, d, x, y, z, W, parent) {     // y 為底部高度
  const geo = new T.BoxGeometry(w, h, d);
  if (W && W.mat) {
    const uv = geo.attributes.uv;
    for (let i = 0; i < 24; i++) {
      const f = i >> 2;
      if (f === 2 || f === 3) { uv.setXY(i, 0, 0); continue; }
      const span = f < 2 ? d : w;
      uv.setXY(i, uv.getX(i) * Math.max(1, Math.round(span / W.tw)) / W.cols, uv.getY(i) * Math.max(1, Math.round(h / W.th)) / W.rows);
    }
  }
  const m = shadow(new T.Mesh(geo, W && W.mat ? W.mat : (W || stone)));
  m.position.set(x, y + h / 2, z); (parent || castle).add(m); return m;
}
function gable(w, h, len, x, y, z, alongX, parent, mat) {
  const s = new T.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const geo = new T.ExtrudeGeometry(s, { depth: len, bevelEnabled: false }); geo.translate(0, 0, -len / 2);
  const m = shadow(new T.Mesh(geo, mat || slate));
  m.position.set(x, y, z); if (alongX) m.rotation.y = Math.PI / 2;
  (parent || castle).add(m); return m;
}
function tower(x, z, r, h, roofH, parent) {
  const p = parent || castle, base = -14, hh = h - base;
  const geo = new T.CylinderGeometry(r, r * 1.06, hh, 20);
  const uv = geo.attributes.uv, su = Math.max(2, Math.round(2 * Math.PI * r / WM.tw)) / WM.cols, sv = Math.round(hh / WM.th) / WM.rows;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  const body = shadow(new T.Mesh(geo, [WM.mat, stone, stone]));
  body.position.set(x, base + hh / 2, z); p.add(body);
  const crown = shadow(new T.Mesh(new T.CylinderGeometry(r * 1.16, r * 1.02, 1.8, 20), darkStone));
  crown.position.set(x, h - 0.9, z); p.add(crown);
  const roof = shadow(new T.Mesh(new T.ConeGeometry(r * 1.22, roofH, 20), slate));
  roof.position.set(x, h + roofH / 2, z); p.add(roof);
  const fin = new T.Mesh(new T.ConeGeometry(0.18, 3.5, 6), gold);
  fin.position.set(x, h + roofH + 1.5, z); p.add(fin);
}
function wall(x1, z1, x2, z2, h) {
  const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz);
  const m = box(L, h + 10, 2.2, (x1 + x2) / 2, -10, (z1 + z2) / 2, stone);
  m.rotation.y = -Math.atan2(dz, dx);
  for (let s = -L / 2 + 1; s < L / 2; s += 2.4) {
    const b = new T.Mesh(new T.BoxGeometry(1.2, 1.2, 2.4), darkStone);
    b.position.set(s, (h + 10) / 2 + 0.6, 0); m.add(b);
  }
}
function archBridge(L, depth, spacing, width, mat) {
  const s = new T.Shape(), n = Math.round(L / spacing), a = spacing * 0.36, top = 3 + a;
  s.moveTo(0, -depth);
  for (let i = 0; i < n; i++) {
    const cx = spacing * (i + 0.5);
    s.lineTo(cx - a, -depth); s.lineTo(cx - a, -top);
    s.absarc(cx, -top, a, Math.PI, 0, true);

  geo.translate(0, 0, -width / 2);
  return shadow(new T.Mesh(geo, mat));
}

  if (Math.abs(dayK - dayWant) > 0.001) { dayK = lerp(dayK, dayWant, 1 - Math.exp(-dt * 2)); applyDay(dayK); }

  const wp = waterGeo.attributes.position.array;
  for (let i = 0; i < wp.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2];
    wp[i + 1] = Math.sin(x * 0.11 + t * 1.1) * 0.22 + Math.sin(z * 0.15 - t * 0.9) * 0.2 + Math.sin((x + z) * 0.31 + t * 1.7) * 0.08;
  }
  waterGeo.attributes.position.needsUpdate = true;

  riders.forEach(g => {
    const u = g.userData, pos = (tt, out) => out.set(
      PITCH.x + Math.cos(tt * u.a + u.p) * 36, PITCH.y + u.h + Math.sin(tt * 0.7 + u.q) * 5, PITCH.z + Math.sin(tt * u.b + u.q) * 20);
    pos(t, g.position); pos(t + 0.1, tmp); g.lookAt(tmp);
  });
  snitch.position.set(PITCH.x + Math.sin(t * 1.3) * 28, PITCH.y + 16 + Math.sin(t * 2.9) * 7, PITCH.z + Math.sin(t * 1.9 + 1) * 16);

  boats.forEach(g => {
    const u = g.userData, s = (t * 0.012 + u.off) % 1;
    const sx = LAKE.x - 60, sz = LAKE.z + 45, ex = shore.x - 6, ez = shore.z + 5;
    const dx = ex - sx, dz = ez - sz, L = Math.hypot(dx, dz);
    g.position.set(lerp(sx, ex, s) - dz / L * u.side, 0.25 + Math.sin(t * 1.3 + u.off * 50) * 0.12, lerp(sz, ez, s) + dx / L * u.side);
    g.rotation.y = Math.atan2(dx, dz);
    g.visible = s < 0.97;
  });

  const tx = -320 + (t * 30) % 640;
  train.position.set(tx, RAIL_Y, RAIL_Z);
  if (viewName === 'train') want.t.x = clamp(tx - 20, -210, 210);
  puffTimer += dt;
  if (puffTimer > 0.22) {
    puffTimer = 0;
    const p = puffs[puffI++ % puffs.length]; p.userData.age = 0; p.position.set(tx + 4, RAIL_Y + 5, RAIL_Z); p.visible = true;
  }
  puffs.forEach(p => {
    const a = (p.userData.age += dt); if (a > 3.4) { p.visible = false; return; }
    p.position.y += dt * 3; p.position.x -= dt * 2;
    p.scale.setScalar((0.8 + a * 1.6) * (1 - smooth(2.4, 3.4, a)) + 0.001);
  });

  for (let i = 0; i < SP; i++) {
    let y = sparkPos[i * 3 + 1] + sparkV[i * 2] * dt;
    if (y > G + 90) y = G - 4;
    sparkPos[i * 3 + 1] = y;
    sparkPos[i * 3] += Math.sin(t * 0.8 + sparkV[i * 2 + 1]) * dt * 0.8;
  }
  sparkGeo.attributes.position.needsUpdate = true;

  updateExtras(dt, t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>

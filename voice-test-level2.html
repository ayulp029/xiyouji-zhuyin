const list=document.getElementById('list');
let audio=null,btnOn=null;
const FLAGGED=new Set([22,24,27,28,29,35,38,39,40,41,48,49]);
function url(key,kind){
  const base=kind==='old'?'audio/voice-test-l2/old/':'audio/';
  return base+encodeURIComponent(key)+'.mp3?v='+V;
}
function stop(){ if(audio){ audio.pause(); audio=null; } if(btnOn){ btnOn.classList.remove('on'); btnOn.textContent=btnOn.dataset.label||'▶ 播放'; btnOn=null; } }
function play(btn,src){
  const same=btnOn===btn; stop(); if(same) return;
  const a=new Audio(src); audio=a; btnOn=btn; btn.classList.add('on'); btn.textContent='■ 播放中';
  const done=()=>{ if(audio===a) stop(); };
  a.addEventListener('ended',done); a.addEventListener('error',done);
  a.play().catch(done);
}
function el(t,c,x){const e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e;}
